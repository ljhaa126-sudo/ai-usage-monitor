<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
  <title>设置</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #000; color: #f5f5f7; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", sans-serif; font-size: 13px; -webkit-font-smoothing: antialiased; }
    body { padding: 44px 22px 30px; user-select: none; }
    .drag { position: fixed; top: 0; left: 0; right: 0; height: 38px; -webkit-app-region: drag; background: #000; z-index: 5; }
    h1 { font-size: 26px; font-weight: 700; letter-spacing: -.4px; margin: 0 4px 18px; }
    .hdr { color: rgba(235,235,245,.55); font-size: 12px; margin: 22px 6px 7px; }
    .grp { background: #0f0f10; border: .5px solid rgba(255,255,255,.08); border-radius: 12px; }
    .row { display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 9px 14px; position: relative; }
    .row + .row::before, .prov + .prov::before { content: ""; position: absolute; top: 0; left: 14px; right: 0; height: .5px; background: rgba(255,255,255,.09); }
    .lab { flex: 1; min-width: 0; }
    .lab small { display: block; color: rgba(235,235,245,.5); font-size: 11.5px; margin-top: 2px; line-height: 1.45; }
    .hint { color: rgba(235,235,245,.45); font-size: 11.5px; line-height: 1.55; margin: 7px 6px 0; }
    .seg { display: flex; background: rgba(118,118,128,.22); border-radius: 8px; padding: 2px; }
    .seg button { border: 0; background: none; color: #f5f5f7; font: inherit; font-size: 12.5px; padding: 5px 11px; border-radius: 6px; cursor: default; white-space: nowrap; }
    .seg button.on { background: #636366; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
    .sw { width: 40px; height: 24px; border-radius: 12px; background: rgba(120,120,128,.32); position: relative; border: 0; flex: none; transition: background .2s; }
    .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.25); transition: left .2s; }
    .sw.on { background: #30D158; } .sw.on::after { left: 18px; }
    input, select { background: rgba(118,118,128,.18); color: #f5f5f7; border: 0; border-radius: 7px; padding: 7px 10px; font: inherit; font-size: 12.5px; outline: none; user-select: text; }
    input { width: 100%; }
    input:focus, select:focus { box-shadow: 0 0 0 2px rgba(10,132,255,.65); }
    input::placeholder { color: rgba(235,235,245,.3); }
    .prov { position: relative; }
    .prov .x { padding: 0 14px 12px 58px; display: flex; flex-direction: column; gap: 7px; margin-top: -3px; }
    .k { display: flex; gap: 7px; }
    .ic { width: 32px; height: 32px; border-radius: 9px; background: #1c1c1e; display: flex; align-items: center; justify-content: center; flex: none; }
    .st { font-size: 11.5px; color: rgba(235,235,245,.5); margin-top: 2px; }
    .st.ok { color: #30D158; } .st.warn { color: #FF9F0A; } .st.err { color: #FF453A; }
    .ord { display: flex; }
    .ord button { border: 0; background: none; color: rgba(235,235,245,.35); width: 22px; height: 22px; border-radius: 6px; font-size: 9px; }
    .ord button:hover { color: #fff; background: rgba(118,118,128,.2); }
    .btn { border: 0; border-radius: 7px; padding: 6px 12px; font: inherit; font-size: 12.5px; background: #0A84FF; color: #fff; white-space: nowrap; }
    .btn.gray { background: rgba(118,118,128,.24); color: #f5f5f7; }
    .btn.red { background: none; color: #FF453A; padding-left: 0; }
    .web { display: flex; align-items: center; gap: 10px; font-size: 12px; color: rgba(235,235,245,.6); }
    .foot { display: flex; justify-content: space-between; align-items: center; margin: 22px 6px 0; color: rgba(235,235,245,.35); font-size: 11.5px; }
    .link { color: #0A84FF; cursor: default; }
    textarea { background: rgba(118,118,128,.18); color: #f5f5f7; border: 0; border-radius: 7px; padding: 7px 10px; font: inherit; font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; outline: none; width: 100%; resize: vertical; line-height: 1.5; user-select: text; }
    textarea:focus { box-shadow: 0 0 0 2px rgba(10,132,255,.65); }
    textarea::placeholder { color: rgba(235,235,245,.3); }
    .tag { font-size: 10.5px; color: rgba(235,235,245,.55); background: rgba(118,118,128,.24); border-radius: 5px; padding: 1px 5px; vertical-align: 1px; }
    .row.add { cursor: default; }
    .row.add:hover .lab { color: #0A84FF; }
    .editor { margin: 4px 14px 12px 58px; padding: 12px; border-radius: 10px; background: rgba(118,118,128,.1); display: flex; flex-direction: column; gap: 8px; }
    .editor .eh { font-size: 12.5px; font-weight: 600; }
    .editor .eh2 { font-size: 11.5px; color: rgba(235,235,245,.5); line-height: 1.5; margin-top: 2px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 11.5px; color: rgba(235,235,245,.5); }
    .chip { border: 0; border-radius: 12px; padding: 4px 10px; font: inherit; font-size: 11.5px; background: rgba(118,118,128,.25); color: #f5f5f7; cursor: default; }
    .chip:hover { background: rgba(118,118,128,.4); }
    .fl { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; font-size: 11.5px; color: rgba(235,235,245,.55); }
    .two { display: flex; gap: 8px; }
    .fl.sm { flex: 0 0 84px; }
    .acts { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
    .test { font-size: 11.5px; border-radius: 7px; padding: 7px 9px; line-height: 1.5; }
    .test.ok { background: rgba(48,209,88,.12); color: #30D158; }
    .test.err { background: rgba(255,69,58,.12); color: #ff8a80; }
    .sample { max-height: 180px; overflow: auto; background: rgba(0,0,0,.45); border-radius: 7px; padding: 8px; font-size: 10.5px; line-height: 1.45; color: rgba(235,235,245,.7); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; user-select: text; }
  </style>
</head>
<body>
  <div class="drag"></div>
  <h1>设置</h1>
  <div id="root"></div>
  <script src="common.js"></script>
  <script src="settings.js"></script>
</body>
</html>
